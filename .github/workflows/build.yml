name: Build VST3 Plugin

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Download JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: master
          path: JUCE

      - name: Build Projucer
        shell: pwsh
        run: |
          $projucerSln = Get-ChildItem -Path "JUCE\extras\Projucer\Builds" -Filter "Projucer.sln*" -Recurse | Select-Object -First 1
          msbuild $projucerSln.FullName /p:Configuration=Release /p:Platform=x64

      - name: Resave .jucer project
        shell: pwsh
        run: |
          (Get-Content MyPlugin.jucer) -replace 'path="[^"]*modules"', 'path="JUCE/modules"' | Set-Content MyPlugin.jucer
          $projucerExe = Get-ChildItem -Path "JUCE\extras\Projucer\Builds" -Filter "Projucer.exe" -Recurse | Select-Object -First 1
          & $projucerExe.FullName --resave MyPlugin.jucer

      - name: Build VST3 Plugin
        shell: pwsh
        run: |
          $sharedProj = Get-ChildItem -Path "Builds" -Filter "*SharedCode.vcxproj" -Recurse | Select-Object -First 1
          if ($sharedProj) {
            msbuild $sharedProj.FullName /p:Configuration=Release /p:Platform=x64
          }
          $vstProj = Get-ChildItem -Path "Builds" -Filter "*VST3.vcxproj" -Recurse | Select-Object -First 1
          msbuild $vstProj.FullName /p:Configuration=Release /p:Platform=x64 /p:PostBuildEventUseInBuild=false

          $dll = Get-ChildItem -Path "Builds" -Filter "*.dll" -Recurse | Where-Object { $_.FullName -like "*VST3*" } | Select-Object -First 1
          $bundleDir = "Output\MyPlugin.vst3\Contents\x86_64-win"
          New-Item -ItemType Directory -Force -Path $bundleDir | Out-Null
          Copy-Item $dll.FullName (Join-Path $bundleDir "MyPlugin.vst3") -Force

      - name: Build EXE Installer
        shell: pwsh
        run: |
          $iss = @"
          [Setup]
          AppName=nike air force 1 low premium clot white silk
          AppVersion=1.0
          DefaultDirName={commoncf}\VST3
          DisableDirPage=yes
          DisableProgramGroupPage=yes
          OutputDir=Installer
          OutputBaseFilename=NikeAirForce1_Installer
          Compression=lzma2
          SolidCompression=yes
          PrivilegesRequired=admin

          [Files]
          Source: "Output\MyPlugin.vst3\*"; DestDir: "{app}\MyPlugin.vst3"; Flags: ignoreversion recursesubdirs createallsubdirs
          "@
          Set-Content -Path "setup.iss" -Value $iss
          iscc "setup.iss"

      - name: Upload Installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: NikeAirForce1-Installer
          path: Installer\NikeAirForce1_Installer.exe

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: master
          path: JUCE

      - name: Build Projucer
        run: |
          xcodebuild -project JUCE/extras/Projucer/Builds/MacOSX/Projucer.xcodeproj -configuration Release

      - name: Resave .jucer project
        run: |
          sed -i '' 's|path="[^"]*modules"|path="JUCE/modules"|g' MyPlugin.jucer
          ./JUCE/extras/Projucer/Builds/MacOSX/build/Release/Projucer.app/Contents/MacOS/Projucer --resave MyPlugin.jucer

      - name: Build Plugin (Universal Intel + Apple Silicon)
        run: |
          xcodebuild -project Builds/MacOSX/MyPlugin.xcodeproj -configuration Release -alltargets ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO

      - name: Package macOS Installer (.pkg)
        run: |
          mkdir -p pkg_root/Library/Audio/Plug-Ins/VST3
          mkdir -p pkg_root/Library/Audio/Plug-Ins/Components
          mkdir -p Installer

          find Builds/MacOSX/build/Release -name "*.vst3" -exec cp -R {} pkg_root/Library/Audio/Plug-Ins/VST3/ \;
          find Builds/MacOSX/build/Release -name "*.component" -exec cp -R {} pkg_root/Library/Audio/Plug-Ins/Components/ \;

          pkgbuild --root pkg_root --identifier com.azotruss.nikeairforce1 --version 1.0 Installer/NikeAirForce1_macOS_Installer.pkg

      - name: Upload macOS Installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: NikeAirForce1-macOS-Installer
          path: Installer/NikeAirForce1_macOS_Installer.pkg
