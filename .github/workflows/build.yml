name: Build VST3 Plugin

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Download JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: master
          path: JUCE

      - name: Build Projucer
        shell: pwsh
        run: |
          $projucerSln = Get-ChildItem -Path "JUCE\extras\Projucer\Builds" -Filter "Projucer.sln*" -Recurse | Select-Object -First 1
          msbuild $projucerSln.FullName /p:Configuration=Release /p:Platform=x64

      - name: Resave .jucer project
        shell: pwsh
        run: |
          (Get-Content MyPlugin.jucer) -replace 'path="[^"]*modules"', 'path="JUCE/modules"' | Set-Content MyPlugin.jucer
          $projucerExe = Get-ChildItem -Path "JUCE\extras\Projucer\Builds" -Filter "Projucer.exe" -Recurse | Select-Object -First 1
          & $projucerExe.FullName --resave MyPlugin.jucer

      - name: Build VST3 Plugin
        shell: pwsh
        run: |
          $sharedProj = Get-ChildItem -Path "Builds" -Filter "*SharedCode.vcxproj" -Recurse | Select-Object -First 1
          if ($sharedProj) {
            msbuild $sharedProj.FullName /p:Configuration=Release /p:Platform=x64
          }
          $vstProj = Get-ChildItem -Path "Builds" -Filter "*VST3.vcxproj" -Recurse | Select-Object -First 1
          msbuild $vstProj.FullName /p:Configuration=Release /p:Platform=x64 /p:PostBuildEventUseInBuild=false

          $dll = Get-ChildItem -Path "Builds" -Filter "*.dll" -Recurse | Where-Object { $_.FullName -like "*VST3*" } | Select-Object -First 1
          $bundleDir = "Output\MyPlugin.vst3\Contents\x86_64-win"
          New-Item -ItemType Directory -Force -Path $bundleDir | Out-Null
          Copy-Item $dll.FullName (Join-Path $bundleDir "MyPlugin.vst3") -Force
          Compress-Archive -Path "Output\MyPlugin.vst3" -DestinationPath "MyPlugin-VST3.zip" -Force

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyPlugin-VST3
          path: MyPlugin-VST3.zip
