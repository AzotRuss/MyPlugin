name: Build VST3 Plugin

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Download JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: master
          path: JUCE

      - name: Build Projucer
        shell: pwsh
        run: |
          $projucerSln = Get-ChildItem -Path "JUCE\extras\Projucer\Builds" -Filter "Projucer.sln*" -Recurse | Select-Object -First 1
          msbuild $projucerSln.FullName /p:Configuration=Release /p:Platform=x64

      - name: Resave .jucer project
        shell: pwsh
        run: |
          (Get-Content MyPlugin.jucer) -replace 'path="[^"]*modules"', 'path="JUCE/modules"' | Set-Content MyPlugin.jucer
          $projucerExe = Get-ChildItem -Path "JUCE\extras\Projucer\Builds" -Filter "Projucer.exe" -Recurse | Select-Object -First 1
          & $projucerExe.FullName --resave MyPlugin.jucer

      - name: Build VST3 Plugin
        shell: pwsh
        run: |
          $sharedProj = Get-ChildItem -Path "Builds" -Filter "*SharedCode.vcxproj" -Recurse | Select-Object -First 1
          if ($sharedProj) {
            msbuild $sharedProj.FullName /p:Configuration=Release /p:Platform=x64
          }
          $vstProj = Get-ChildItem -Path "Builds" -Filter "*VST3.vcxproj" -Recurse | Select-Object -First 1
          msbuild $vstProj.FullName /p:Configuration=Release /p:Platform=x64

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyPlugin-VST3
          path: Builds\**\VST3\
